name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Python core (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - name: Lint
        run: uvx ruff check src tests --select F,E9,B,I
      - name: Tests (local Jupyter stands in for the Colab runtime)
        run: uv run pytest -q

  core-windows:
    # GPUDock is a desktop app, so the local side must also pass on Windows.
    # Tests marked posix_runtime are skipped there (Colab runtimes are Linux).
    name: Python core (tests, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
